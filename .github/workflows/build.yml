name: Build Mac app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Type-check (every error, both targets)
        run: |
          SDK=$(xcrun --show-sdk-path --sdk macosx)
          check() { # name, files...
            name=$1; shift
            xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-macos14.0 "$@" > "tc-$name.log" 2>&1 || true
            grep -E "error:" "tc-$name.log" | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -60 | while IFS= read -r line; do echo "::error::[$name] $line"; done
            ! grep -q "error:" "tc-$name.log"
          }
          ok=0
          check app $(find App Shared -name '*.swift') || ok=1
          check widgets $(find Widgets Shared -name '*.swift') || ok=1
          exit $ok

      - name: Build
        run: |
          set +e
          xcodebuild -project VinylPlayer.xcodeproj -target VinylPlayer -configuration Release \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SYMROOT="$PWD/build" build > build.log 2>&1
          status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -60
          # A real app has its program inside; never publish an empty bundle.
          test $status -eq 0 && test -x "build/Release/Vinyl Player.app/Contents/MacOS/Vinyl Player" \
            && test -x "build/Release/Vinyl Player.app/Contents/PlugIns/VinylWidgets.appex/Contents/MacOS/VinylWidgets"

      - name: Show errors
        if: failure()
        run: |
          grep -E "error:" build.log | grep -v "^\*\*" | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//$GITHUB_WORKSPACE\//}"
          done

      - name: Package zip
        run: |
          cd build/Release
          ditto -c -k --keepParent "Vinyl Player.app" "$GITHUB_WORKSPACE/VinylPlayer.zip"

      - name: Package dmg
        run: |
          brew install create-dmg >/dev/null
          mkdir -p dmg && cp -R "build/Release/Vinyl Player.app" dmg/
          tiffutil -cathidpicheck Config/dmg-background.png Config/dmg-background@2x.png -out dmg-background.tiff
          # Finder layout via AppleScript can be flaky on CI runners: retry, then fall back to a plain dmg.
          for i in 1 2 3; do
            rm -f VinylPlayer.dmg
            create-dmg \
              --volname "Vinyl Player" \
              --volicon "build/Release/Vinyl Player.app/Contents/Resources/AppIcon.icns" \
              --background dmg-background.tiff \
              --window-pos 200 120 --window-size 600 400 \
              --icon-size 112 --text-size 13 \
              --icon "Vinyl Player.app" 150 200 --hide-extension "Vinyl Player.app" \
              --app-drop-link 450 200 \
              VinylPlayer.dmg dmg/ && break
            sleep 5
          done
          if [ ! -f VinylPlayer.dmg ]; then
            ln -s /Applications dmg/Applications
            hdiutil create -volname "Vinyl Player" -srcfolder dmg -ov -format UDZO VinylPlayer.dmg
          fi
          ls -la VinylPlayer.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: VinylPlayer
          path: |
            VinylPlayer.dmg
            VinylPlayer.zip

      - name: Publish download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VinylPlayer.dmg VinylPlayer.zip --prerelease --target "$GITHUB_SHA" \
            --title "Vinyl Player (latest build)" \
            --notes "Latest build. Download VinylPlayer.dmg, open it and drag Vinyl Player into Applications. See README → Install."
